name: Build and deploy

# Push to main  -> build, deploy to Cloudflare Pages, purge Cloudflare cache
# Pull request  -> build only (catches errors before they reach production)
# Manual run    -> Actions tab > Build and deploy > Run workflow (use to force a refresh)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.123.7
          extended: true

      # baseURL comes from hugo.toml (https://drnorfaizal.com/) so canonical
      # URLs, hreflang and the sitemap always point at the real domain.
      - name: Build site
        run: hugo --gc --minify

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: drnorfaizal
          directory: public
          branch: main

      - name: Purge Cloudflare cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_CACHE_TOKEN: ${{ secrets.CF_CACHE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ]; then
            echo "::warning::CF_ZONE_ID secret not set - cache purge skipped"
            exit 0
          fi
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_CACHE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
