fd_cases_intro: "Dr Nor Faizal operates across three clinical domains. Complex and refractory cases are especially welcomed &mdash; the difficult cases are where subspecialty expertise matters most."
fd_urgent_h3: "For Urgent Neurological Cases"
fd_urgent_body: "If your patient presents with rapid neurological deterioration, new seizure with mass on imaging, cauda equina syndrome, or thunderclap headache &mdash; please refer directly to the Emergency Department at KPJ Tawakkal or contact the clinic immediately. Urgent cases are triaged and accommodated as a priority."
