fd_cases_h2: "Kes yang <em>Diterima</em>"
fd_cases_intro: "Dr Nor Faizal berkhidmat dalam tiga bidang klinikal. Kes kompleks dan refraktori amat dialu-alukan &mdash; kes yang sukar itulah yang paling memerlukan kepakaran subkepakaran."
fd_urgent_h3: "Untuk Kes Neurologi Segera"
fd_urgent_body: "Jika pesakit anda mengalami kemerosotan neurologi yang pantas, sawan baharu dengan ketumbuhan pada imej, sindrom cauda equina, atau sakit kepala mendadak yang teruk (thunderclap headache) &mdash; sila rujuk terus ke Jabatan Kecemasan KPJ Tawakkal atau hubungi klinik dengan segera. Kes segera ditriaj dan diberi keutamaan."
