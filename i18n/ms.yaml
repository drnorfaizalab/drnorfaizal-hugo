fd_process: "Proses Rujukan"
fd_how_h2: "Cara <em>Merujuk</em>"
fd_how_intro: "Proses rujukan direka semudah yang mungkin. Kebanyakan rujukan diatur dalam beberapa hari; kes segera dalam 24&ndash;48 jam."
fd_ready: "Sedia Digunakan"
fd_template_h2: "Templat <em>Rujukan</em>"
fd_template_intro: "Salin dan ubah suai templat di bawah untuk mesej WhatsApp atau surat rujukan anda. Semua ruangan adalah pilihan &mdash; ringkasan klinikal yang pendek sudah memadai untuk memulakan rujukan."
